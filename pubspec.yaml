name: smartspectra_flutter
description: >-
  Unofficial Flutter plugin for the Presage SmartSpectra SDK. Read pulse,
  breathing, HRV, blinking and facial expressions from the camera on Android
  and iOS.
version: 0.1.0
homepage: https://github.com/waqaralisiyal23/smartspectra_flutter
repository: https://github.com/waqaralisiyal23/smartspectra_flutter
issue_tracker: https://github.com/waqaralisiyal23/smartspectra_flutter/issues
topics:
  - camera
  - health
  - heart-rate
  - vitals
  - rppg

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.waqar.smartspectra_flutter
        pluginClass: SmartspectraFlutterPlugin
      ios:
        pluginClass: SmartspectraFlutterPlugin
